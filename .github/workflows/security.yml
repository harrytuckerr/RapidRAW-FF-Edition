name: Secret and public metadata checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Read repository history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Obtain checksum-pinned official Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/rapidraw-gitleaks"
          mkdir -p "$tool_dir"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 15 --max-time 120 \
            'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz' \
            --output "$tool_dir/gitleaks.tar.gz"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$tool_dir/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$tool_dir/gitleaks.tar.gz" -C "$tool_dir" --no-same-owner gitleaks
          chmod 0755 "$tool_dir/gitleaks"

      - name: Scan all fetched history locally with upstream default rules
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/rapidraw-gitleaks/gitleaks" git . \
            --log-opts='--all --full-history' \
            --config=.gitleaks.toml --gitleaks-ignore-path=.gitleaksignore \
            --ignore-gitleaks-allow --redact=100 --exit-code=1 --timeout=600 \
            --no-banner --no-color --report-format=json \
            --report-path="$RUNNER_TEMP/gitleaks-redacted.json"
          # No scan data is uploaded to an external scanner or artifact service.

      - name: Reject personal metadata in current public documents
        if: success() || failure()
        shell: bash
        run: |
          python3 -m unittest discover -s .github/tests -p 'test_public_metadata.py'
          python3 .github/scripts/check_public_metadata.py

  glib-variant-iter:
    name: Optimized Linux GLib iterator regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: 1.98.1
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Read reviewed standalone regression workspace
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install system GLib development prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libglib2.0-dev pkg-config

      - name: Select exact minimal Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.1 --profile minimal --no-self-update
          rustc --version
          cargo --version
          pkg-config --modversion glib-2.0

      - name: Run four optimized GLib backport regressions
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/rapidraw-glib-variant-iter-target
        run: |
          set -euo pipefail
          cargo test --locked --release --manifest-path security-tests/glib-variant-iter/Cargo.toml -- --nocapture --test-threads=1
